# xdg-desktop-portal-hyprland config (hyprlang syntax, NOT the lua layer)
# https://wiki.hyprland.org/Useful-Utilities/Hyprland-desktop-portal/

# Force SHM buffers for screencopy.
# Fixes Zoom black screen on 2nd+ screenshare: Zoom demands a DMA-BUF with an
# Intel modifier it can't render on reconnect. SHM sidesteps DMA negotiation.
# Tradeoff: applies to ALL screensharing (CPU-copies frames) - comment out if
# you need GPU-path high-res sharing in OBS etc.
screencopy {
    force_shm = 1
}
