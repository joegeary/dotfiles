# Shell.
set-option -g default-shell /usr/bin/zsh

# Terminal.
set-option -ga terminal-overrides ",screen-256color:Tc"
set-option -g default-terminal "${TERM}"
set-option -ga terminal-features 'xterm*:extkeys'

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Settings.
setw -g mode-keys vi
setw -g mouse on
set -s escape-time 0
set -g focus-events on
set -g automatic-rename on
set-option -g set-titles on
set-option -gw xterm-keys on
set -g status-interval 1
set -g allow-passthrough on
set -s extended-keys on

# Start numbering from 1.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix to ctrl+space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Some setup.
unbind h
unbind j
unbind k
unbind l
unbind M-h
unbind M-j
unbind M-k
unbind M-l

# Modes
bind -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Bind r to source config file.
unbind r
bind r source ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-h' select-pane -L

bind -n M-S-q kill-pane
bind | split-window -c "#{pane_current_path}" -h zsh
bind _ split-window -c "#{pane_current_path}" -v zsh
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-= next-layout

# Windows.
bind -n M-Tab next-window
bind -n M-S-Tab previous-window
#bind -n M-l next-window
#bind -n M-h previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0
bind -n M-w command-prompt -I "#W" "rename-window '%%'"

# Session.
bind -n M-r command-prompt -I "#S" "rename-session '%%'"

# Programs.
bind -n M-t display-popup -h 65% -w 75% -x 50% -E "__tmux_select_pane.sh"
bind -n M-h new-window -n "github" "gh dash"
bind -n M-g new-window -c "#{pane_current_path}" -n "git" lazygit
bind -n M-s new-window -c "#{pane_current_path}" -n "shell" zsh
bind -n M-e new-window -c "#{pane_current_path}" -n "editor" "nvim ."
bind -n M-f run-shell "__tmux_trigger_yazi.sh"

# Utils/Scripts
bind h run-shell "__tmux_toggle_borders.sh"

# Sessions
bind -n M-x display-popup -E "zsh -c '__tmux_sessionizer.sh --no-popup'"
bind -n M-e display-popup -E "tmux list-sessions | set -E 's/:.*$//' | fzf --reverse | xargs tmux kill-session -t"
bind -n M-t display-popup -E "__tmux_list_session.sh"

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jeffnguyen695/tmux-zoxide-session'
run '~/.tmux/plugins/tpm/tpm'

# Message style.
set -g message-style "fg=yellow,bg=black"
set -g message-command-style "fg=yellow,bg=black"

# Pane style.
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=black"

# # Status style.
set -g status-style "fg=yellow,bg=black"
set -g status-left "#[fg=cyan,bg=black]#[fg=black,bg=cyan,bold] #{session_windows}#[fg=cyan,bg=black]  "
set -g status-right "#[fg=colour8,bg=black] #S #[fg=green,bg=black] #[fg=black,bg=green,bold]󱫋 #{session_attached}#[fg=green,bg=black]"
set -g status-left-length 100
set -g status-position top
set -g status-justify left

# Window style.
set -g window-status-style "fg=colour8,bg=black"
set -g window-status-current-format "#[fg=cyan,bg=black] #[fg=cyan,bg=black]#W"
set -g window-status-format "#[fg=gray,bg=default] #[fg=gray,bg=default]#W"
set -g window-status-separator "  "
