# Personal ghostty overrides.
#
# Pulled in by a `config-file` line appended to ~/.config/ghostty/config, which
# ghostty loads *after* the file referencing it - so these values win. Same
# layering as overrides.gitconfig: Omarchy's own config stays unmanaged and
# keeps getting updates.
#
# Ported from the pre-Omarchy kitty config. Everything else in that file was
# already covered by Omarchy's ghostty defaults, or is owned by the platform
# (theme comes from omarchy's dynamic theme config-file, decorations from
# Hyprland), so only these three lines are a real delta.

# kitty ran 10.5pt. Omarchy's ghostty default is 9, ghostty's own default is 12.
font-size = 10.5

# kitty: `modify_font cell_height 122%`. ghostty's adjust-* keys are deltas from
# the default rather than multipliers, so 22% gives the same 122% line height.
adjust-cell-height = 22%

# kitty: `map ctrl+enter send_text all \x1b[13;5u`.
# Omarchy already sends shift+enter and alt+shift+enter as CSI-u, but not
# ctrl+enter - without this a TUI cannot tell it from a plain Enter.
keybind = ctrl+enter=csi:13;5u
