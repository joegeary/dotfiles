## Auto-connect Bluetooth audio profiles.
## A2DP roles keep speakers/receivers exposing their high-fidelity playback
## profiles. The headset roles (hfp_hf/hsp_hs) MUST stay in this list so the
## handsfree link is established on connect - otherwise apps like Zoom cannot
## auto-switch to the mic and won't detect the headset until a full reconnect.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
        bluez5.autoswitch-profile = true
      }
    }
  }
]
